{{- if .Values.networkPolicy.enabled }}
# Ingress: ONLY the broker pods may reach the minting endpoint.
# Egress: DNS, the origin serving the broker's JWKS, and the VOMS server(s)
# voms-proxy-init actually contacts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "voms-token-service.fullname" . }}
  labels:
    {{- include "voms-token-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "voms-token-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.broker.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.broker.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # DNS — required to resolve the JWKS and VOMS server origins.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # The broker's JWKS endpoint (config.brokerJwksUrl) — the service's
    # only in-cluster outbound dependency.
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.jwks.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.jwks.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.jwks.port }}

    # The VOMS server(s) voms-proxy-init contacts — external to the
    # cluster, hence an ipBlock rule rather than a namespace/pod selector.
    # Restrict networkPolicy.voms.cidr to your VO's real VOMS server
    # IPs/CIDRs in production.
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.voms.cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.voms.port }}
{{- end }}
