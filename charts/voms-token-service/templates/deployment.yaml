apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voms-token-service.fullname" . }}
  labels:
    {{- include "voms-token-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "voms-token-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "voms-token-service.selectorLabels" . | nindent 8 }}
    spec:
      # This pod never talks to the Kubernetes API; withholding the
      # ServiceAccount token removes an entire credential class from a pod
      # that already holds the homes PVC mount.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # See values.yaml: reading arbitrary users' ~/.globus/*.pem requires
      # runAsUser 0 plus CAP_DAC_READ_SEARCH (container-level, below);
      # everything else stays locked down (read-only rootfs, drop ALL bar
      # that one capability, no privilege escalation, RuntimeDefault
      # seccomp).
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # The Memory-backed emptyDir Kubernetes creates for /tmp starts with
        # root:root 0755 — no write permission for others. voms-proxy-init runs
        # as the requesting user (after SETUID) and must create per-user
        # subdirectories there, so restore the sticky-bit world-writable mode
        # that a conventional /tmp carries.
        - name: fix-tmp-perms
          image: {{ include "voms-token-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["chmod", "1777", "/tmp"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- if .Values.crlRefresh.enabled }}
        # Seeds the writable "certificates" emptyDir from the image's
        # baked IGTF bundle, then does a best-effort first CRL refresh.
        # entrypoint.sh's pixi activation gives us PATH (openssl, curl) and
        # X509_CERT_DIR — pointing at the BAKED directory here, since
        # nothing is mounted over it in this container.
        - name: seed-certificates
          image: {{ include "voms-token-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/entrypoint.sh"]
          args:
            - bash
            - -c
            - |
              set -euo pipefail
              cp -a "$X509_CERT_DIR/." /certificates/
              cd /certificates
              bash ./refresh_crls.sh || echo "WARNING: initial CRL refresh failed; continuing with baked CRLs"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: certificates
              mountPath: /certificates
          {{- with .Values.crlRefresh.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      containers:
        - name: voms-token-service
          image: {{ include "voms-token-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Names must match Settings fields (config.py).
            - name: BROKER_JWKS_URL
              value: {{ .Values.config.brokerJwksUrl | quote }}
            - name: BROKER_ISSUER
              value: {{ .Values.config.brokerIssuer | quote }}
            - name: EXPECTED_AUDIENCE
              value: {{ .Values.config.expectedAudience | quote }}
            - name: HOME_ROOT
              value: {{ .Values.config.homeRoot | quote }}
            - name: VOMS_PROXY_INIT_BIN
              value: {{ .Values.config.vomsProxyInitBin | quote }}
            - name: VOMS_PROXY_INFO_BIN
              value: {{ .Values.config.vomsProxyInfoBin | quote }}
            - name: DEFAULT_VOMS
              value: {{ .Values.config.defaultVoms | quote }}
            - name: DEFAULT_VALID
              value: {{ .Values.config.defaultValid | quote }}
            - name: PROXY_INIT_TIMEOUT_SECONDS
              value: {{ .Values.config.proxyInitTimeoutSeconds | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            # Extra env vars from values (name: value pairs)
            {{- range $key, $val := .Values.env }}
            - name: {{ $key | quote }}
              value: {{ $val | quote }}
            {{- end }}
          volumeMounts:
            # The homes PVC — mounted read-only at config.homeRoot. Nothing
            # is ever written here: the minted proxy goes to a per-user
            # 0700 dir on the pod's tmpfs /tmp, created by the
            # voms-proxy-init child running AS the requesting user.
            - name: homes
              mountPath: {{ .Values.homes.mountPath }}
              readOnly: true
            # readOnlyRootFilesystem requires an explicit writable /tmp:
            # each mint gets a per-user 0700 dir here (proxy_tmp_root),
            # created and cleaned up by the impersonated child. tmpfs-backed
            # (Memory) so any key material
            # never touches disk, even transiently.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.crlRefresh.enabled }}
            # Overlays the baked X509_CERT_DIR with the writable emptyDir
            # so the init container's seed + the sidecar's periodic
            # refresh are visible here too — zero env overrides needed:
            # entrypoint.sh's baked `export X509_CERT_DIR=...` already
            # points at this exact path.
            - name: certificates
              mountPath: {{ include "voms-token-service.certificatesPath" . }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            # readyz verifies voms-proxy-init is executable and the broker
            # JWKS is fetchable.
            httpGet:
              path: /readyz
              port: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.crlRefresh.enabled }}
        # Periodically re-runs ca-policy-lcg's refresh_crls.sh against the
        # same writable emptyDir the main container mounts, so its
        # X509_CERT_DIR stays current between pod restarts. Locked down:
        # no homes mount, no DAC_READ_SEARCH — it never touches user
        # files, only its own certificates overlay.
        - name: crl-refresh
          image: {{ include "voms-token-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/entrypoint.sh"]
          args:
            - bash
            - -c
            - |
              while true; do
                sleep {{ .Values.crlRefresh.intervalSeconds }}
                bash "$X509_CERT_DIR/refresh_crls.sh" || echo "WARNING: periodic CRL refresh failed; will retry next interval"
              done
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: certificates
              mountPath: {{ include "voms-token-service.certificatesPath" . }}
          {{- with .Values.crlRefresh.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: homes
          persistentVolumeClaim:
            claimName: {{ .Values.homes.existingClaim }}
            readOnly: true
        - name: tmp
          emptyDir:
            medium: Memory
        {{- if .Values.crlRefresh.enabled }}
        - name: certificates
          emptyDir: {}
        {{- end }}
